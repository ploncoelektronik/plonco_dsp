<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1219">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<title>PL 2.4 DSP · Plonco Elektronik</title>
<style>
:root{
  --bg:#0a0f15;--bg2:#0e151d;--panel:#121a23;--panel2:#18222e;--line:#243242;--line2:#2f4156;
  --tx:#e8eef5;--dim:#8a9aad;--mute:#5d6e82;--acc:#22d3ee;--acc2:#3b82f6;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;
  --r:12px;color-scheme:dark
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(1200px 500px at 50% -200px,#10202e 0,transparent 70%),var(--bg)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:30;background:rgba(10,15,21,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hbar{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
#logo{display:flex;flex:none;filter:drop-shadow(0 2px 6px rgba(34,211,238,.18))}
.brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.4px;line-height:1.15;white-space:nowrap}
.brand small{display:block;font-size:9.5px;letter-spacing:2.6px;color:var(--acc);font-weight:600;text-transform:uppercase;margin-top:1px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid var(--line);border-radius:99px;background:var(--bg2);font-size:12px;color:var(--dim);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad)}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}.dot.demo{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.hbtns{display:flex;gap:8px}
nav{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;padding:10px 16px;color:var(--dim);font-weight:600;letter-spacing:.2px;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--tx)}
nav button.sel{color:var(--acc);border-bottom-color:var(--acc)}

/* ---------- elemen dasar ---------- */
button{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 13px;cursor:pointer;min-height:34px;transition:.12s}
button:hover{border-color:var(--line2);background:#1d2937}
button:active{transform:translateY(1px)}
button.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#041a24;border:none;font-weight:700}
button.pri:hover{filter:brightness(1.08)}
button.bad{border-color:#5b2a2f;color:var(--bad)}button.bad:hover{background:#2a1519}
button.on{background:rgba(34,211,238,.16);border-color:var(--acc);color:var(--acc);font-weight:600}
button.mute.on{background:rgba(248,113,113,.18);border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.38;cursor:default;pointer-events:none}
select,input[type=text],input[type=number]{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;min-height:34px}
input[type=range]{width:100%;accent-color:var(--acc);height:26px;background:transparent}
main{max-width:1180px;margin:0 auto;padding:16px}
.page{display:none}.page.sel{display:block}
#warn{display:none;max-width:1148px;margin:12px auto 0;padding:10px 14px;border:1px solid #6b5412;background:#251d08;color:var(--warn);border-radius:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.dim{color:var(--dim)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two>.card{margin-bottom:0}.two{margin-bottom:14px}
.hint{font-size:12px;color:var(--mute);margin-top:8px}
.danger{color:var(--bad)}
.tag{font-size:11px;padding:2px 9px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);color:var(--dim);font-weight:600}
.tag.ok{color:var(--ok);border-color:#1f5a46}.tag.warn{color:var(--warn);border-color:#6b5412}
.ctl{display:grid;grid-template-columns:104px 1fr 92px;gap:12px;align-items:center;margin:9px 0}
.ctl label{color:var(--dim);font-size:13px}
.ctl output{text-align:right;font-variant-numeric:tabular-nums;color:var(--acc);font-weight:600;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chips button{padding:5px 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:none;border-radius:0;background:var(--panel2)}.seg button+button{border-left:1px solid var(--line)}
canvas.g{width:100%;height:240px;background:#080c11;border:1px solid var(--line);border-radius:10px;touch-action:none;display:block}
canvas.g.sq{height:260px;max-width:300px}

/* ---------- mixer: strip console ---------- */
.console{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.cs{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:12px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.cs.out{border-top:2px solid var(--acc)}.cs.in{border-top:2px solid #a78bfa}
.cs.muted .faderwrap{opacity:.45}
.cs .nm{font-weight:800;letter-spacing:.6px;font-size:13px;text-align:center;line-height:1.1}
.cs .nm small{display:block;font-size:10px;color:var(--dim);letter-spacing:1.2px;font-weight:600;margin-top:3px;min-height:12px}
.faderwrap{display:flex;gap:5px;height:214px;align-items:stretch}
.scale{display:flex;flex-direction:column;justify-content:space-between;font-size:9px;color:var(--mute);text-align:right;padding:4px 0;font-variant-numeric:tabular-nums;width:22px}
.vm{width:12px;background:#070b10;border:1px solid var(--line);border-radius:4px;position:relative;overflow:hidden;margin:4px 0}
.vm i{position:absolute;inset:0;background:linear-gradient(0deg,#16a34a 0 60%,#a3e635 60% 72%,var(--warn) 72% 88%,var(--bad) 88%);clip-path:inset(100% 0 0 0)}
.vm b{position:absolute;left:0;right:0;height:2px;background:#fff;bottom:0;opacity:.9}
.fader{width:34px;position:relative;cursor:ns-resize;touch-action:none;outline-offset:0}
.rail{position:absolute;left:50%;top:12px;bottom:12px;width:5px;transform:translateX(-50%);background:#070b10;border:1px solid var(--line);border-radius:3px}
.fz{position:absolute;left:3px;right:3px;height:1px;background:var(--mute);transform:translateY(-.5px)}
.fk{position:absolute;left:1px;right:1px;height:22px;transform:translateY(-50%);border-radius:5px;background:linear-gradient(180deg,#3a4a5e,#222e3c);border:1px solid #4b5f78;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.fk::after{content:"";position:absolute;left:5px;right:5px;top:50%;height:2px;background:var(--acc);transform:translateY(-50%);border-radius:1px}
.fader:focus-visible .fk{border-color:var(--acc)}
.cs output{font-variant-numeric:tabular-nums;font-weight:700;color:var(--acc);font-size:13px}
.cs .btn2{display:flex;gap:5px;width:100%}.cs .btn2 button{flex:1;padding:6px 0}
.cs .edit{width:100%;font-size:12px;color:var(--dim)}
.cs .gr{font-size:10px;color:var(--warn);min-height:13px;font-weight:700;letter-spacing:.4px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}

/* ---------- preset ---------- */
.pre{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pslot{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.pslot .t{font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;gap:6px}
.lnk{display:inline-flex;gap:6px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:3px 6px 3px 11px;margin:3px 4px 3px 0}
.lnk button{min-height:22px;padding:0 7px;border-radius:99px}

/* ---------- editor gambar ---------- */
.imged{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:16px;align-items:start}
.imgprev{width:100%;max-width:340px;aspect-ratio:160/128;image-rendering:pixelated;border:1px solid var(--line2);border-radius:8px;background:#000;cursor:grab;touch-action:none;display:block;box-shadow:0 0 0 5px #05080c,0 0 0 6px var(--line)}
.imgprev.drop{outline:2px dashed var(--acc);outline-offset:4px}
.imgprev.nopan{cursor:default}
.prog{height:8px;background:var(--bg2);border:1px solid var(--line);border-radius:5px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .12s}
.sw{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px;cursor:pointer}
.sw input{accent-color:var(--acc);width:16px;height:16px}

footer{max-width:1180px;margin:8px auto 0;padding:0 16px 28px;color:var(--mute);font-size:12px;display:flex;align-items:center;gap:8px;justify-content:center}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);background:#0f1822;border:1px solid var(--line2);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.22s;z-index:99;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{border-color:#7a2f35;color:#ffb4b4}#toast.ok{border-color:#1f6a50}

@media(max-width:860px){
  .two{grid-template-columns:1fr}.two>.card{margin-bottom:14px}.two{margin-bottom:0}
  .console{grid-template-columns:repeat(3,minmax(0,1fr))}
  .imged{grid-template-columns:1fr}
}
@media(max-width:560px){
  .ctl{grid-template-columns:80px 1fr 74px;gap:8px}
  .hbar{padding:8px 12px}.brand small{letter-spacing:1.8px}
  main{padding:12px}
  .faderwrap{height:190px}
}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="brand">
      <span id="logo" aria-label="Plonco Elektronik"></span>
      <div><h1>PL 2.4 DSP</h1><small>Plonco Elektronik</small></div>
    </div>
    <span class="pill"><span id="dot" class="dot"></span><span id="stat">Belum terhubung</span></span>
    <div class="hbtns">
      <button id="bConn" class="pri">Sambungkan</button>
      <button id="bSync" disabled title="Ambil ulang semua nilai dari alat">Sinkron</button>
      <button id="bDemo" title="Coba tampilan tanpa perangkat">Demo</button>
      <button id="bAll" style="display:none" title="Tampilkan semua perangkat BLE di sekitar, bukan hanya PL2.4-DSP">Semua perangkat</button>
    </div>
  </div>
  <nav id="tabs"></nav>
</header>
<div id="warn"></div>
<main>
  <section class="page" id="pg-mix"></section>
  <section class="page" id="pg-ch"></section>
  <section class="page" id="pg-pre"></section>
  <section class="page" id="pg-sys"></section>
</main>
<footer><span id="flogo"></span>PL 2.4 DSP Remote · Plonco Elektronik</footer>
<div id="toast"></div>

<script>
(() => {
'use strict';
/* ====================== KONSTANTA ====================== */
const SVC = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const RXU = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
const TXU = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const FS = 48000;
const CHN = ['IN A','IN B','OUT 1','OUT 2','OUT 3','OUT 4'];
const SPK = ['SUB','LOW','MID','HI'];
const EQ_NAMES = ['Off','Peak','LowShelf','HighShelf','LowPass','HighPass','Notch','BandPass','AllPass'];
const XO_NAMES = ['Off','Butterworth 12','Butterworth 18','Butterworth 24','Butterworth 48','Linkwitz-Riley 12','Linkwitz-Riley 24','Linkwitz-Riley 48','Bessel 12','Bessel 18','Bessel 24','Bessel 48'];
const TONE_NAMES = ['OFF','Sine','Pink noise'];
const THEMES = ['Cyan','Amber','Emerald','Violet','Crimson','Ice','Mono'];
const EQ_F0 = [31.5,63,125,250,500,1000,2000,4000,8000,16000];
const $ = (s, r = document) => r.querySelector(s);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
};

/* ====================== LOGO PLONCO ELEKTRONIK ====================== */
const iconBody = id => `<defs><linearGradient id="pbg${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13293b"/><stop offset="1" stop-color="#08121b"/></linearGradient>
<linearGradient id="pac${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs>
<rect x="2" y="2" width="60" height="60" rx="15" fill="url(#pbg${id})" stroke="#1d3a52" stroke-width="1.5"/>
<path d="M21 46V18H34a10 10 0 0 1 0 20H21" fill="none" stroke="url(#pac${id})" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M26.5 28q2-6 4 0t4 0t4 0" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M21 51.5H44" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round" opacity=".55"/><circle cx="21" cy="51.5" r="2.2" fill="#22d3ee"/><circle cx="46.5" cy="51.5" r="2.2" fill="#fbbf24"/>`;
const iconSvg = (id, size) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="${size}" height="${size}">${iconBody(id)}</svg>`;
/* logo penuh untuk layar TFT 160x128 (ikon + wordmark), dipakai sebagai gambar boot bawaan Plonco */
const tftLogoSvg = () => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 128" width="160" height="128">
<rect width="160" height="128" fill="#0a1118"/><rect width="160" height="3" fill="#22d3ee"/>
<g transform="translate(52 9) scale(.875)">${iconBody('t')}</g>
<g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" text-anchor="middle">
<text x="81" y="86" font-size="17" font-weight="800" letter-spacing="2.4" fill="#f1f5f9">PLONCO</text>
<text x="81.5" y="98.5" font-size="7.4" font-weight="700" letter-spacing="4.1" fill="#22d3ee">ELEKTRONIK</text>
<text x="80" y="111" font-size="6.4" font-weight="500" letter-spacing=".6" fill="#8a9aad">DSP 2 IN / 4 OUT  ·  PL 2.4</text></g></svg>`;
$('#logo').innerHTML = iconSvg('h', 34);
$('#flogo').innerHTML = iconSvg('f', 16);
{ const l = document.createElement('link'); l.rel = 'icon'; l.href = 'data:image/svg+xml,' + encodeURIComponent(iconSvg('i', 64)); document.head.append(l); }

/* ====================== STATE ====================== */
const ST = [{}, {}, {}, {}, {}, {}];
const meta = { link: [0,0,0,0,0,0], tone: [0,1000,-30], theme: 0, autoSave: 1, bl: [100, 15], names: ['','','','','',''],
  presets: Array.from({length:5}, () => ({used:0, name:''})),
  ui: { b: 18, h: 30, s: 120, p: 1, t: 1, f: 15 }, img: [null, null], fs: 1 };
const lev = new Array(6).fill(-90), hold = new Array(6).fill(-90), holdT = new Array(6).fill(0), gr = [0,0,0,0];
let connected = false, demo = false, curTab = 'mix', curCh = 2, curPage = {0:'gain',1:'gain'}, curBand = 0;
const bindings = new Map(), touched = new Map();
const v = (ch, k, d = 0) => (ST[ch][k] !== undefined ? ST[ch][k] : d);
const tagOf = i => meta.names[i] || (i >= 2 ? SPK[i - 2] : '');
const isOut = ch => ch >= 2;

function toast(msg, kind = '') {
  const t = $('#toast'); t.textContent = msg; t.className = 'show ' + kind;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = ''; }, 3200);
}

/* ====================== TRANSPORT BLE ====================== */
let dev = null, rxC = null, txC = null, wq = Promise.resolve(), rbuf = '', retry = 0, wchunk = 20, mtuVal = 0;
const diag = { tx: 0, rx: 0, lines: 0, last: '-', rtt: null, pingT: 0, mtu: 0, fsTotal: 0, fsUsed: 0, ie: '', fw: '?', rs: '?', hp: '? (tekan Tes ping)', au: '? (tekan Tes ping)', upinfo: '-', up: 0 };
const dec = new TextDecoder(), enc = new TextEncoder();

function setStatus(txt, mode) {
  $('#stat').textContent = txt;
  $('#dot').className = 'dot' + (mode ? ' ' + mode : '');
  $('#bSync').disabled = !(connected || demo);
  $('#bConn').textContent = connected ? 'Putuskan' : 'Sambungkan';
  $('#bDemo').textContent = demo ? 'Keluar demo' : 'Demo';
}
let upGen = 0;
function sendRaw(line, reliable = false, gen = null) {
  if (demo) { demoHandle(line); return; }
  if (!connected || !rxC) return;
  const data = enc.encode(line + '\n'); diag.tx += data.length;
  wq = wq.then(async () => {
    if (gen !== null && gen !== upGen) return;   // blok lama yang sudah diganti pengiriman ulang: lewati
    for (let i = 0; i < data.length; i += wchunk) {
      const part = data.slice(i, i + wchunk);
      // ulangi bila Android menolak sesaat ("GATT operation already in progress"); jangan buang sisa baris
      for (let t = 0; ; t++) {
        try { if (reliable && rxC.writeValueWithResponse) await rxC.writeValueWithResponse(part); else if (rxC.writeValueWithoutResponse) await rxC.writeValueWithoutResponse(part); else await rxC.writeValue(part); break; }
        catch (e) { if (t >= 6 || !rxC) throw e; await new Promise(r => setTimeout(r, 15 * (t + 1))); }
      }
    }
  }).catch(e => console.warn('tulis gagal', e));
}
const pending = new Map(); let flushT = 0;
function setParam(ch, key, val) {
  ST[ch][key] = val; touched.set(ch + ':' + key, performance.now()); pending.set(ch + ':' + key, val);
  if (!flushT) flushT = setTimeout(flush, 40);
  scheduleDraw(); if (curTab === 'mix') updateStripVals();
}
function flush() {
  flushT = 0;
  for (const [k, val] of pending) { const [ch, key] = k.split(':'); sendRaw(`S,${ch},${key},${Number.isInteger(val) ? val : +val.toFixed(3)}`); }
  pending.clear();
}
const cmd = s => sendRaw(s);

async function connectBle(all = false) {
  if (!navigator.bluetooth) return;
  try {
    setStatus('Mencari perangkat…');
    dev = await navigator.bluetooth.requestDevice(all ? { acceptAllDevices: true, optionalServices: [SVC] } : { filters: [{ namePrefix: 'PL2.4' }, { services: [SVC] }], optionalServices: [SVC] });
    dev.addEventListener('gattserverdisconnected', onDisc);
    await openGatt();
  } catch (e) { console.warn(e); setStatus(e.name === 'NotFoundError' ? 'Tidak ada perangkat dipilih' : 'Gagal: ' + e.message);
    $('#bAll').style.display = ''; if (e.name === 'NotFoundError') toast('Alat tidak ketemu? Coba tombol “Semua perangkat” di atas.', 'err'); }
}
async function openGatt() {
  setStatus('Menyambung…');
  const srv = await dev.gatt.connect();
  const svc = await srv.getPrimaryService(SVC);
  rxC = await svc.getCharacteristic(RXU); txC = await svc.getCharacteristic(TXU);
  txC.addEventListener('characteristicvaluechanged', ev => feed(dec.decode(ev.target.value, { stream: true })));
  await txC.startNotifications();
  connected = true; retry = 0; rbuf = ''; wchunk = 20;
  setStatus('Terhubung · ' + dev.name, 'on');
  sendRaw('GET'); sendRaw('MET,1');
}
function onDisc() {
  if (uploading && !up.err) up.err = 'disc';
  connected = false; rxC = txC = null; setStatus('Terputus');
  if (retry < 3 && dev) { retry++; setTimeout(() => dev && !connected && openGatt().catch(() => onDisc()), 1500); }
}
function disconnectBle() { retry = 99; if (dev && dev.gatt.connected) dev.gatt.disconnect(); connected = false; setStatus('Terputus'); }
function feed(s) { diag.rx += s.length; rbuf += s; let i; while ((i = rbuf.indexOf('\n')) >= 0) { const l = rbuf.slice(0, i).trim(); rbuf = rbuf.slice(i + 1); if (l) parseLine(l); } }

/* ====================== PARSER PESAN ESP32 ====================== */
const up = { acked: 0, err: null, done: false };
function parseLine(l) {
  const f = l.split(','), c = f[0]; diag.lines++; if (c !== 'M') diag.last = l.slice(0, 48);
  if (c === 'P') {
    const ch = +f[1], key = f[2], val = parseFloat(f[3]);
    if (!(ch >= 0 && ch < 6)) return;
    ST[ch][key] = val;
    const b = bindings.get(ch + ':' + key), t = touched.get(ch + ':' + key) || 0;

$('#bDemo').addEventListener('click', () => { demo ? stopDemo() : (connected && disconnectBle(), startDemo()); });
document.addEventListener('visibilitychange', () => { if (connected && !uploading) sendRaw('MET,' + (document.hidden ? 0 : 1)); });
window.addEventListener('resize', () => { scheduleDraw(); if (curTab === 'mix') updateStripVals(); });
if (!navigator.bluetooth) {
  const w = $('#warn'); w.style.display = 'block';
  w.textContent = 'Browser ini tidak mendukung Web Bluetooth. Pakai Chrome atau Edge (Android, Windows, macOS, Linux) lewat HTTPS atau file lokal. Di iPhone/iPad Safari tidak bisa — pakai aplikasi browser “Bluefy”. Mode Demo tetap bisa dicoba.';
  $('#bConn').disabled = true;
}
setTab('mix'); requestAnimationFrame(animate);
})();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
